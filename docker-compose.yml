services:
  jupyter:
    build: .
    container_name: market_makers_jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    environment:
      - JUPYTER_TOKEN=marketmaker 
    networks:
      - market-simulator-net

networks:
  market-simulator-net:
    external: true
    name: market_simulator_market-simulator-net